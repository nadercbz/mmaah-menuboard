<!doctype html>
<html lang="de">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mmaah Menuboard, drei Screens</title>
<meta name="theme-color" content="#1b010c">
<link rel="icon" href="assets/food/korean-fried-chicken-7st.webp">
<link rel="stylesheet" href="css/board.css">
<style>
html, body { margin: 0; min-height: 100%; background: #1b010c; color: #fcfaf7; font-family: "MB Text", sans-serif; }
.leiste { position: sticky; top: 0; z-index: 60; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 14px; background: #1b010c; }
.leiste strong { font: 900 15px/1 "MB Display", sans-serif; text-transform: uppercase; letter-spacing: -.01em; margin-right: 6px; }
.knopf { font: 600 13.5px/1 "MB Text", sans-serif; padding: 11px 15px; min-height: 40px; border-radius: 99px; background: #4f0423; color: #fcfaf7; }
.knopf:hover { background: #6a0a33; }
.knopf[aria-pressed="true"] { background: #ff4005; }
.rechts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
a.knopf { text-decoration: none; display: inline-flex; align-items: center; }
.wand { display: flex; justify-content: center; gap: var(--spalt); padding: 8px 14px 18px; --spalt: 10px; }
.rahmen { position: relative; flex: none; background: #000; border-radius: 6px; outline: 4px solid #000; overflow: hidden; }
.tipp { padding: 0 14px 18px; font-size: 13px; opacity: .72; text-align: center; }
@media (max-width: 820px) {
  .wand { justify-content: flex-start; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; padding: 8px 12px 16px; }
  .rahmen { scroll-snap-align: center; }
  .leiste { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .leiste::-webkit-scrollbar { display: none; }
  .leiste strong { display: none; }
  .knopf { flex: none; white-space: nowrap; }
  .rechts { margin-left: 0; flex-wrap: nowrap; }
}
</style>
</head>
<body>
<div class="leiste" role="toolbar" aria-label="Menuboard Steuerung">
  <strong>Mmaah Menuboard</strong>
  <button class="knopf" data-f="vegan" aria-pressed="false" type="button">Vegan</button>
  <button class="knopf" data-f="veggie" aria-pressed="false" type="button">Veggie</button>
  <button class="knopf" data-f="spicy" aria-pressed="false" type="button">Spicy</button>
  <div class="rechts">
    <button class="knopf" id="show" type="button">Show über alle Screens</button>
    <button class="knopf" id="pause" aria-pressed="false" type="button">Pause</button>
    <a class="knopf" href="tv.html?tv=1" target="_blank" rel="noopener">Screen 1</a>
    <a class="knopf" href="tv.html?tv=2" target="_blank" rel="noopener">Screen 2</a>
    <a class="knopf" href="tv.html?tv=3" target="_blank" rel="noopener">Screen 3</a>
  </div>
</div>
<main class="wand" id="wand">
  <div class="rahmen"><div class="b" aria-label="Screen 1, Korean Fried Chicken"></div></div>
  <div class="rahmen"><div class="b" aria-label="Screen 2, Reisgerichte und BBQ Fries"></div></div>
  <div class="rahmen"><div class="b" aria-label="Screen 3, Drinks, Snacks, Sides und Dessert"></div></div>
</main>
<p class="tipp">Tippe auf ein Produkt für Details und Allergene. Die Screens laufen synchron, auch einzeln im Vollbild.</p>
<script src="js/daten.js"></script>
<script src="js/allergene.js"></script>
<script src="js/board.js"></script>
<script>
(function () {
  var rahmen = [].slice.call(document.querySelectorAll(".rahmen")), hosts = [].slice.call(document.querySelectorAll(".b"));
  var wand = document.getElementById("wand"), leiste = document.querySelector(".leiste");
  function passt() {
    var eng = innerWidth <= 820;
    var hoehe = innerHeight - leiste.offsetHeight - 58;
    var breite = eng ? innerWidth - 40 : (innerWidth - 28 - 20) / 3;
    var s = eng ? breite / 1080 : Math.min(breite / 1080, hoehe / 1920);
    rahmen.forEach(function (r, i) {
      r.style.width = 1080 * s + "px"; r.style.height = 1920 * s + "px";
      hosts[i].style.transform = "scale(" + s + ")";
    });
  }
  MB.start(hosts.map(function (h, i) { return { el: h, nr: i + 1 }; }), { art: "m" }).then(function () {
    passt(); addEventListener("resize", passt);
    MB.laden();
    var pause = false, versatz = 0, stand = 0;
    (function schleife() {
      if (!pause) { stand = (Date.now() / 1000 + versatz) % MB.LOOP; MB.zeit(stand); }
      requestAnimationFrame(schleife);
    })();
    document.getElementById("pause").addEventListener("click", function () {
      if (pause) versatz = (stand - Date.now() / 1000) % MB.LOOP;
      pause = !pause; this.setAttribute("aria-pressed", pause); this.textContent = pause ? "Weiter" : "Pause";
    });
    document.getElementById("show").addEventListener("click", function () {
      /* Springt direkt zur Animation über alle drei Screens */
      versatz = (23.7 - Date.now() / 1000) % MB.LOOP;
      if (pause) { pause = false; var p = document.getElementById("pause"); p.setAttribute("aria-pressed", false); p.textContent = "Pause"; }
    });
    var filter = null, knoepfe = [].slice.call(document.querySelectorAll("[data-f]"));
    knoepfe.forEach(function (k) {
      k.addEventListener("click", function () {
        filter = filter === k.dataset.f ? null : k.dataset.f;
        knoepfe.forEach(function (x) { x.setAttribute("aria-pressed", x.dataset.f === filter); });
        MB.filter(filter);
      });
    });
    addEventListener("keydown", function (e) {
      if (e.key === " ") { e.preventDefault(); document.getElementById("pause").click(); }
      if (e.key === "Escape") { MB.boards.forEach(function (b) { b.schliesse(); }); }
    });
  });
})();
</script>
</body>
</html>
